name: Backup

# Copia diária do banco de produção, criptografada, guardada por 30 dias nos
# artefatos do GitHub. O repositório é público, por isso o arquivo nunca sai
# em texto aberto.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Exporta o banco
        run: npx wrangler d1 export lista-do-mercado --remote --output backup.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Criptografa
        run: |
          test -n "$BACKUP_PASSPHRASE" || { echo "Falta o segredo BACKUP_PASSPHRASE"; exit 1; }
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in backup.sql -out "lista-$(date +%F).sql.enc" -pass env:BACKUP_PASSPHRASE
          rm backup.sql
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}

      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: lista-*.sql.enc
          retention-days: 30
