name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Permite republicar pela aba Actions sem precisar de um commit novo.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Monta o pacote da Cloudflare sem publicar, para pegar erros de bundle.
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

  # Publica a cada push na main. Fica desligado até a variável
  # DEPLOY_ENABLED valer "true" no repositório.
  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    concurrency: producao
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
