<title>Lista do Mercado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Stencil:wght@600;800&display=swap">
<link rel="stylesheet" href="css/styles.css">

<div class="page">
  <header class="top">
    <h1>Lista do Mercado</h1>
    <p id="status" aria-live="polite">Carregando…</p>
  </header>

  <div id="banner" class="banner" hidden></div>

  <form id="addForm">
    <div class="add-row1">
      <div class="cat-picker">
        <select id="newCat" class="cat-select" aria-label="Categoria do item"></select>
        <button type="button" id="addCatBtn" class="cat-plus" aria-label="Criar nova categoria">+</button>
      </div>
      <input id="newItem" type="text" placeholder="O que precisa comprar?" autocomplete="off" maxlength="80">
      <button type="submit">Adicionar</button>
    </div>
    <div class="new-cat-row" id="newCatRow" hidden>
      <input type="text" id="newCatInput" placeholder="Nome da nova categoria" maxlength="40" autocomplete="off">
      <button type="button" id="confirmNewCat">Criar</button>
    </div>
  </form>

  <button type="button" class="link-btn" id="toggleImport">Importar lista</button>
  <div id="importPanel" hidden>
    <p class="hint">Cole vários itens de uma vez, um por linha. Uma linha só com o nome de uma categoria (ex.: "Hortifruti") vira um título e organiza os itens seguintes.</p>
    <textarea id="importText" rows="6" placeholder="Hortifruti&#10;Banana&#10;Tomate&#10;&#10;Limpeza&#10;Detergente"></textarea>
    <div class="add-row2">
      <label for="importCat">Categoria padrão</label>
      <select id="importCat" class="cat-select-wide" aria-label="Categoria padrão da importação"></select>
    </div>
    <div class="import-actions">
      <button type="button" id="cancelImport">Cancelar</button>
      <button type="button" id="doImport">Importar</button>
    </div>
  </div>

  <section class="card">
    <h2>Para comprar</h2>
    <div id="listToBuy"></div>
    <div class="empty" id="emptyState" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h2l2.4 12.2a2 2 0 0 0 2 1.8h7.2a2 2 0 0 0 2-1.6L21 9H7"/><circle cx="10" cy="21" r="1"/><circle cx="17" cy="21" r="1"/></svg>
      <div>Sua lista está vazia.<br>Adicione o primeiro item ali em cima!</div>
    </div>
  </section>

  <section class="card" id="boughtSection" hidden>
    <h2>Já comprado</h2>
    <ul class="list" id="listBought"></ul>
  </section>

  <div class="footer-actions" id="clearWrap" hidden>
    <button id="clearBought" type="button">Limpar comprados</button>
  </div>
</div>
